# Feature 009 — §5 scope-vs-request source of truth (FR-002; T003/T010).
#
# The enumerated categories the §5 written data-copy letter asks ezyVet to
# deliver, per practice database. scope_check.py compares delivered contents
# against this list to produce a per-database present/absent/short disposition,
# and gap_notice.py detects partial deliveries against it. The `key` values are
# the ScopeCategory enum members (backend/models.py).

categories:
- key: patient_client
  label: Patient & client records, INCLUDING clinical/medical records and histories
  source_entities:
  - addresses
  - animal_master_problems
  - clients
  - consults
  - contacts
  - diagnostic_results
  - diagnostics
  - events
  - health_status
  - master_problems
  - medications
  - patients
  - presenting_problems
  - therapeutics
  - vaccinations
  - visit_exams
  - visit_history
  required: true
  note: "The \xA75 letter's first bullet requests patient/client records 'including clinical/medical records\
    \ and histories'. The clinical entities were REQUESTED; omitting them here let a delivery with zero\
    \ clinical files pass scope-check as complete while SC-004 claims completeness covers clinical. Corrected\
    \ 2026-07-29 (spec-013 discovery)."
- key: scheduling
  label: Scheduling / appointments
  source_entities:
  - appointments
  - resources
  - appointment_types
  required: true
- key: invoicing_billing_payments
  label: Invoicing, billing & payments (financial / AR / ledger)
  source_entities:
  - invoices
  - invoice_lines
  - ledger
  - payments
  - ar_balances
  required: true
- key: communications
  label: Client communications
  source_entities:
  - communications
  - messages
  required: true
- key: attachments_imaging
  label: Attachments & imaging
  source_entities:
  - attachments
  - documents
  - images
  required: true
- key: configuration
  label: Practice configuration (products/services, providers, settings)
  source_entities:
  - products
  - services
  - providers
  - settings
  - inventory
  required: true
