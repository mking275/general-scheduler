# Feature 009 — ezyVet complete-export -> canonical field map (T003/T015).
#
# The reusable group PRIOR the ezyVet adapter drives (migration_agent.py
# per-source field-map precedent). A prior, not an assumption: each database is
# profiled independently for schema drift (FR-026); an entity/field absent from
# this map is FLAGGED, never silently dropped (FR-007).
#
# Structure per source entity:
#   canonical_category : the CanonicalRecord.category value
#   ref_builder        : which entity_ref.py builder seeds the lineage key
#                        (client | patient | staff | household | none)
#   id_field           : the source column carrying the stable PIMS id
#   target_table       : the net-new canonical table (financial/inventory only)
#   fields             : source_column -> canonical_field

variant: complete_v1
pims: ezyvet

entities:

  # ---- patient/client + configuration (hydrate existing platform tables) ----
  clients:
    canonical_category: client
    ref_builder: client
    id_field: client_id
    fields:
      client_id: source_id
      first_name: first_name
      last_name: last_name
      phone: phone
      email: email
      address: address

  patients:
    canonical_category: patient
    ref_builder: patient
    id_field: patient_id
    fields:
      patient_id: source_id
      client_id: client_source_id
      name: name
      species: species
      breed: breed
      status: status

  providers:
    canonical_category: provider
    ref_builder: staff
    id_field: provider_id
    fields:
      provider_id: source_id
      name: name
      role: role

  appointments:
    canonical_category: appointment
    ref_builder: none
    id_field: appointment_id
    fields:
      appointment_id: source_id
      patient_id: patient_source_id
      provider_id: provider_source_id
      start: start_time
      type: appointment_type

  products:
    canonical_category: product_service
    ref_builder: none
    id_field: product_id
    fields:
      product_id: source_id
      name: name
      unit_price: unit_price

  communications:
    canonical_category: communication
    ref_builder: none
    id_field: communication_id
    fields:
      communication_id: source_id
      client_id: client_source_id
      channel: channel
      body: body

  attachments:
    canonical_category: attachment
    ref_builder: none
    id_field: attachment_id
    fields:
      attachment_id: source_id
      patient_id: patient_source_id
      kind: kind
      filename: filename

  # ---- invoicing/billing/payments — financial / AR / ledger / payment -------
  invoices:
    canonical_category: invoice
    ref_builder: none
    id_field: invoice_id
    target_table: InvoiceRecord
    fields:
      invoice_id: source_id
      client_id: client_ref
      total: total
      status: status
      issued_at: issued_at

  ledger:
    canonical_category: ledger
    ref_builder: none
    id_field: ledger_id
    target_table: LedgerEntry
    fields:
      ledger_id: source_id
      account: account_ref
      amount: amount
      entry_type: entry_type
      posted_at: posted_at

  payments:
    canonical_category: payment
    ref_builder: none
    id_field: payment_id
    target_table: PaymentRecord
    fields:
      payment_id: source_id
      client_id: client_ref
      amount: amount
      method: method
      received_at: received_at

  ar_balances:
    canonical_category: ar_balance
    ref_builder: none
    id_field: ar_id
    target_table: ARBalance
    fields:
      ar_id: source_id
      client_id: client_ref
      balance: balance
      as_of: as_of

  # ---- inventory ------------------------------------------------------------
  inventory:
    canonical_category: inventory
    ref_builder: none
    id_field: inventory_id
    target_table: InventoryItem
    fields:
      inventory_id: source_id
      product_id: product_ref
      qty_on_hand: qty_on_hand
      unit: unit
      last_counted_at: last_counted_at

# ── SOURCE-ABSENT ENTITIES (recorded 2026-07-29 from the first real delivery) ──
# Profiled against Coastal Creek Animal Hospital's complete export. Three entities
# this map declares are NOT PRESENT in what ezyVet actually ships. They are recorded
# here as source-absent rather than deleted, so the profiler keeps FLAGGING them
# (FR-007) instead of a future reader assuming they were never wanted.
#
#   ar_balances  — ezyVet ships NO accounts-receivable aging file and no per-client
#                  balance field. AR must be DERIVED (invoice line items minus
#                  payments, per client). Matt's ruling 2026-07-29: reconcile against
#                  derived figures AND state plainly in the reconciliation report
#                  that this is because ezyVet does not provide an AR aging report.
#                  The disclosure is not optional — a derived figure presented as if
#                  it were the source's own is the dishonest version of this.
#
#   inventory    — Coastal Creek does not track inventory in ezyVet (confirmed with
#                  the practice). Mark NOT-TRACKED-IN-SOURCE for this practice rather
#                  than reporting a gap; where stock actually lives is an open
#                  question with the group. Re-check per practice: absence here is a
#                  practice-level fact, not an ezyVet-level one.
#
#   providers    — no roster file; staff identities are embedded as fields on
#                  consults and appointments. Derive the provider set from those
#                  rather than expecting an export.

source_absent:
  ar_balances:
    reason: not_exported_by_source
    handling: derive_and_disclose
    disclosure: >-
      Accounts-receivable figures in this report are DERIVED from invoice line
      items less payments, because ezyVet does not provide an accounts-receivable
      aging report in its export. They have not been reconciled against a
      practice-supplied AR statement.
  inventory:
    reason: not_tracked_in_source_by_this_practice
    handling: mark_not_applicable
    scope: per_practice
  providers:
    reason: no_roster_export
    handling: derive_from_consults_and_appointments
