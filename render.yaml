services:
  - type: web
    name: general-scheduler-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: DB_PATH
        value: /var/data/scheduler.db
    disk:
      name: scheduler-data
      mountPath: /var/data
      sizeGB: 1
